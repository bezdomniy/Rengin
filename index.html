<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rengin Path Tracer</title>

    <!-- Built by trunk: the library with the `web` feature (see Trunk.toml). -->
    <link data-trunk rel="rust" data-cargo-no-default-features data-cargo-features="web" data-wasm-opt="2" />
    <base data-trunk-public-url />

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #ddd;
            font-family: system-ui, sans-serif;
        }
        /* The canvas fills the viewport; the renderer letterboxes the image to the
           scene camera's aspect ratio. */
        #rengin-canvas, canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }
        canvas {
            outline: none;
            touch-action: none;
        }
        #no-webgpu {
            display: none;
            box-sizing: border-box;
            max-width: 32em;
            margin: 40vh auto 0;
            padding: 0 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- The wasm entry point appends its canvas here (src/lib.rs). -->
    <div id="rengin-canvas"></div>
    <p id="no-webgpu">
        This path tracer needs WebGPU, which this browser doesn't support or has turned off.
        Try a recent version of Chrome, Edge or Safari.
    </p>
    <script>
        if (!navigator.gpu) {
            document.getElementById("rengin-canvas").style.display = "none";
            document.getElementById("no-webgpu").style.display = "block";
        }
    </script>
</body>
</html>
