[package]
name = "rengin"
version = "0.1.0"
authors = ["Ilia <ilia.shibaev@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# The web build is the library's wasm_bindgen(start) entry point, so the binary
# only exists on native. This also lets trunk pick the cdylib unambiguously.
[[bin]]
name = "rengin"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["glam/std", "dep:pollster", "dep:clap", "dep:env_logger"]
web = ["glam/libm", "getrandom/wasm_js", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:console_log", "dep:console_error_panic_hook", "dep:web-time", "dep:js-sys"]

[dependencies]
# Graphics
wgpu = { version = "30.0", features = ["vulkan-portability", "naga-ir"] }
naga_oil = "0.23"
winit = "0.30"

# Math & data
glam = { version = "0.30", default-features = false, features = ["bytemuck"] }
bytemuck = { version = "1.23", features = ["derive"] }

# Scene loading
tobj = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

# Utilities
getrandom = "0.3"
itertools = "0.14"
cfg-if = "1"
futures = { version = "0.3" }
log = "0.4"

# Native-only (optional)
pollster = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

# Web-only (optional)
wasm-bindgen = { version = "0.2.114", optional = true }
wasm-bindgen-futures = { version = "0.4.64", optional = true }
console_log = { version = "1.0", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
web-time = { version = "1.1", optional = true }
js-sys = { version = "0.3.91", optional = true }

[dependencies.web-sys]
version = "0.3.91"
optional = true
features = [
    "Window", "Document", "HtmlCanvasElement", "Element", "Node",
    "Location", "UrlSearchParams",
    # Downloading gzipped models
    "Response", "ReadableStream", "WritableStream", "ReadableWritablePair",
    "DecompressionStream", "CompressionFormat",
]

[profile.release]
debug = true
