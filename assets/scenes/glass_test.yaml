# Glass refraction test scene
# Tests nested dielectrics: glass sphere with air pocket, glass ball on water surface
- add: camera
  width: 900
  height: 900
  field-of-view: 0.698132
  from: [278, 278, -760]
  to: [278, 278, 0]
  up: [0, 1, 0]

- define: base-material
  value:
    color: [1, 1, 1]
    diffuse: 0.7
    ambient: 0.1

- define: white-material
  extend: base-material
  value:
    color: [0.73, 0.73, 0.73]

- define: green-material
  extend: base-material
  value:
    color: [0.12, 0.45, 0.15]

- define: red-material
  extend: base-material
  value:
    color: [0.65, 0.05, 0.05]

# ======================================================
# Ceiling light
# ======================================================
- add: cube
  material:
    emissiveness: [8, 8, 8]
    color: [1, 1, 1]
  transform:
    - [scale, 65, 0.5, 53]
    - [translate, 278, 554, 278]

# ======================================================
# Glass sphere with air pocket (nested dielectric test)
# Outer: glass RI=1.52, Inner: air RI=1.0
# ======================================================
- add: sphere
  material:
    color: [1, 1, 1]
    reflective: 1
    transparency: 1
    refractive-index: 1.52
  transform:
    - [scale, 90, 90, 90]
    - [translate, 186, 90, 200]

- add: sphere
  material:
    color: [1, 1, 1]
    reflective: 1
    transparency: 1
    refractive-index: 1
  transform:
    - [scale, 87, 87, 87]
    - [translate, 186, 90, 200]

# ======================================================
# Solid glass sphere (single dielectric, no air pocket)
# ======================================================
- add: sphere
  material:
    color: [0.95, 1, 0.95]
    reflective: 1
    transparency: 1
    refractive-index: 1.52
  transform:
    - [scale, 70, 70, 70]
    - [translate, 400, 70, 350]

# ======================================================
# Small colored glass sphere (high RI diamond-like)
# ======================================================
- add: sphere
  material:
    color: [0.9, 0.95, 1]
    reflective: 1
    transparency: 1
    refractive-index: 2.42
  transform:
    - [scale, 40, 40, 40]
    - [translate, 320, 40, 100]

# ======================================================
# Walls, floor, ceiling
# ======================================================
- add: cube
  material: white-material
  transform:
    - [scale, 278, 1, 278]
    - [translate, 278, 0, 278]

- add: cube
  material: white-material
  transform:
    - [scale, 278, 1, 278]
    - [translate, 278, 555, 278]

- add: cube
  material: white-material
  transform:
    - [scale, 278, 1, 278]
    - [rotate-x, 1.5708]
    - [translate, 278, 278, 555]

- add: cube
  material: red-material
  transform:
    - [scale, 278, 1, 278]
    - [rotate-z, 1.5708]
    - [translate, 555, 278, 278]

- add: cube
  material: green-material
  transform:
    - [scale, 278, 1, 278]
    - [rotate-z, 1.5708]
    - [translate, 0, 278, 278]
