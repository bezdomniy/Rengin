- add: camera
  width: 900
  height: 600
  field-of-view: 1.2
  from: [0, 3, 0]
  to: [10, 3, 0]
  up: [0, 1, 0]

- define: sand-material
  value:
    color: [0.76, 0.70, 0.50]
    diffuse: 0.7
    ambient: 0.1
    specular: 0.2
    shininess: 50

- define: white-light
  value:
    color: [1, 1, 1]
    emissiveness: [8, 7, 6]

- define: sponza
  value:
    add: obj
    file: assets/models/sponza.obj

- add: sponza
  material: sand-material
  transform:
    - [scale, 0.01, 0.01, 0.01]

# Distant sun-like light
- add: sphere
  material: white-light
  transform:
    - [scale, 30, 30, 30]
    - [translate, 50, 200, -30]
